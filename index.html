<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desert Rider — prototype</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="title">
        <div class="eyebrow" id="eyebrow">DESERT RIDER / BATTLE PROTOTYPE</div>
        <div class="headline" id="headline">在沙上，狩獵。</div>
        <div class="sub" id="sub">懸浮機車原型 · 輝光＋沙塵 · 地形 endless</div>
        <div class="coin-count" id="coin-count"><span class="coin-disc"></span>金幣 <b id="coins">0</b></div>
      </div>

      <div class="levels" id="levels" aria-label="關卡"><span>關卡</span></div>

      <div class="energy"><div class="energy-fill" id="energy"></div></div>

      <div class="stats">
        <div class="speed"><span id="speed">0</span><small>km/h</small></div>
        <div class="state">離地 <span id="gap">0.9</span> m · <span id="state">懸停</span></div>
        <div class="counters">
          <span>擊破 <b id="kills">0</b></span>
          <span>捕獲 <b id="caught">0</b></span>
          <span>夥伴 <b id="allies">0</b></span>
        </div>
      </div>

      <div class="reticle"><div class="ring"></div><div class="tag">搜尋中</div></div>

      <div class="help">
        W/↑ 加速 · S/↓ 減速 · A D 轉向 · Shift 推進 · Space 跳躍 · C 切換鏡頭 · 拖曳滑鼠 環顧 · R 重置 · 1 / 2 / 3 切換關卡<br />
        手把：RT、左搖桿前推 油門 · LT、後拉 煞車 · 左右 轉向 · A 跳躍 · X 或 LB 推進 · Y 切換鏡頭 · 右搖桿環顧 · Menu 重置
      </div>
      <div class="fps" id="fps"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
